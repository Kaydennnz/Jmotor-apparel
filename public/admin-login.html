<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jmotor Staff Portal</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/admin-login.js" defer></script>
  </head>
  <body class="portal-login-body">
    <main class="portal-login-page">
      <section class="portal-login-card" aria-labelledby="admin-login-title">
        <p class="portal-login-brand">Jmotor Apparel</p>
        <h1 id="admin-login-title">Jmotor Staff Portal</h1>
        <form id="admin-login-form" class="portal-login-form">
          <label for="admin-login-username">Username</label>
          <input id="admin-login-username" name="username" type="text"
                 autocomplete="username" required>

          <label for="admin-login-password">Password</label>
          <input id="admin-login-password" name="password" type="password"
                 autocomplete="current-password" required>

          <p id="admin-login-message" class="form-message" role="status" aria-live="polite"></p>
          <button id="admin-login-submit" class="add-button" type="submit">Sign in</button>
        </form>
      </section>
    </main>
  </body>
</html>
