<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | Jmotor Apparel</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/nav.js" defer></script>
    <script src="/js/admin.js" defer></script>
  </head>
  <body class="admin-portal-body">
    <div class="portal-layout">
      <aside class="portal-sidebar">
        <div class="portal-sidebar-heading">
          <a class="portal-brand" href="/admin.html#dashboard">Jmotor Apparel</a>
          <span class="portal-brand-label">Admin</span>
          <button class="portal-menu-toggle portal-sidebar-toggle" type="button"
                  aria-label="Toggle menu" aria-expanded="true" aria-controls="portal-navigation">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
          </button>
        </div>
        <nav id="portal-navigation" class="portal-navigation" aria-label="Admin">
          <a id="tab-reports" class="portal-nav-item" href="#dashboard"
             aria-controls="panel-reports">Dashboard</a>
          <a class="portal-nav-item" href="/staff.html">Orders</a>
          <a id="tab-products" class="portal-nav-item" href="#products"
             aria-controls="panel-products">Products</a>
          <a id="tab-staff" class="portal-nav-item" href="#staff"
             aria-controls="panel-staff">Staff</a>
          <button class="portal-logout" type="button" data-portal-logout>Logout</button>
        </nav>
      </aside>

      <main class="portal-main">
        <button class="portal-menu-toggle portal-content-toggle" type="button" aria-label="Toggle menu"
                aria-expanded="false" aria-controls="portal-navigation" hidden>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </button>
        <header class="portal-page-heading">
          <div>
            <p class="portal-kicker">Store management</p>
            <h1 id="portal-heading">Dashboard</h1>
          </div>
          <a class="portal-orders-link" href="/staff.html">View orders</a>
        </header>
        <p id="admin-message" class="page-message portal-message" role="status" aria-live="polite"></p>
        <div id="admin-app" class="portal-content" hidden>
          <section id="panel-reports" class="portal-section" data-section="dashboard"
                   aria-labelledby="tab-reports" hidden>
            <div id="admin-reports"></div>
          </section>

          <section id="panel-products" class="portal-section" data-section="products"
                   aria-labelledby="tab-products" hidden>
            <div class="portal-section-heading">
              <div>
                <p class="portal-kicker">Catalog</p>
                <h2>Products</h2>
              </div>
              <button id="add-product-button" class="add-button admin-action-button portal-add-product-button" type="button">
                Add product
              </button>
            </div>
            <div class="portal-product-filters" role="search" aria-label="Filter products">
              <label>
                <span>Search products</span>
                <input id="product-search" type="search" autocomplete="off"
                       placeholder="Search by product name">
              </label>
              <label>
                <span>Category</span>
                <select id="product-category-filter">
                  <option value="">All categories</option>
                </select>
              </label>
              <label>
                <span>Status</span>
                <select id="product-status-filter">
                  <option value="">All</option>
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </label>
            </div>
            <div id="admin-products" class="portal-table-scroll admin-products-table-wrap"></div>
          </section>

          <section id="panel-staff" class="portal-section" data-section="staff"
                   aria-labelledby="tab-staff" hidden>
            <div class="portal-section-heading">
              <div>
                <p class="portal-kicker">Team access</p>
                <h2>Staff</h2>
              </div>
            </div>
            <section class="admin-card portal-card">
              <h3>Staff accounts</h3>
              <div id="admin-staff-list" class="portal-table-scroll"></div>
            </section>
            <section class="admin-card portal-card">
              <h3>Create staff account</h3>
              <form id="staff-form" class="admin-form portal-staff-form">
                <div>
                  <label for="staff-username">Username</label>
                  <input id="staff-username" name="username" type="text"
                         pattern="[A-Za-z0-9_]{3,50}" minlength="3" maxlength="50"
                         autocomplete="username" required>
                </div>
                <div>
                  <label for="staff-name">Display name</label>
                  <input id="staff-name" name="displayName" type="text" maxlength="100" required>
                </div>
                <div>
                  <label for="staff-password">Password</label>
                  <input id="staff-password" name="password" type="password"
                         minlength="8" autocomplete="new-password" required>
                </div>
                <button class="add-button admin-action-button" type="submit">Create staff</button>
              </form>
            </section>
          </section>
        </div>
      </main>
    </div>

    <dialog id="product-dialog" class="admin-dialog">
      <form id="product-form" class="admin-form">
        <div class="admin-dialog-heading">
          <h2 id="product-dialog-title">Add product</h2>
          <button class="admin-dialog-close" type="button" data-close-dialog aria-label="Close">×</button>
        </div>
        <label for="product-name">Name</label>
        <input id="product-name" name="name" type="text" maxlength="150" required>
        <label for="product-description">Description</label>
        <textarea id="product-description" name="description" rows="3"></textarea>
        <label for="product-category">Category</label>
        <select id="product-category" name="categoryId" required></select>
        <div id="active-field" class="admin-active-field" hidden>
          <input id="product-active" name="active" type="checkbox">
          <label for="product-active">Active</label>
        </div>
        <div id="new-variants-field">
          <div class="admin-panel-heading">
            <h3>Variants</h3>
            <button id="add-variant-row" class="secondary-button admin-inline-button" type="button">
              Add variant row
            </button>
          </div>
          <div id="new-variant-rows" class="admin-variant-rows"></div>
        </div>
        <p class="admin-form-error" aria-live="polite"></p>
        <div class="admin-dialog-actions">
          <button class="secondary-button admin-inline-button" type="button" data-close-dialog>Close</button>
          <button class="add-button admin-inline-button" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="variant-dialog" class="admin-dialog">
      <form id="variant-form" class="admin-form">
        <div class="admin-dialog-heading">
          <h2 id="variant-dialog-title">Add variant</h2>
          <button class="admin-dialog-close" type="button" data-close-dialog aria-label="Close">×</button>
        </div>
        <label for="variant-size">Size</label>
        <input id="variant-size" name="size" type="text" maxlength="30">
        <label for="variant-color">Color</label>
        <input id="variant-color" name="color" type="text" maxlength="50">
        <div class="admin-form-grid">
          <div>
            <label for="variant-price">Price (whole number)</label>
            <input id="variant-price" name="price" type="number" min="1" step="1" required>
          </div>
          <div>
            <label for="variant-stock">Stock</label>
            <input id="variant-stock" name="stock" type="number" min="0" step="1" required>
          </div>
        </div>
        <p class="admin-form-error" aria-live="polite"></p>
        <div class="admin-dialog-actions">
          <button class="secondary-button admin-inline-button" type="button" data-close-dialog>Close</button>
          <button class="add-button admin-inline-button" type="submit">Save</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
